site_name: Dotfiles
site_description: Chezmoi-managed Arch Linux desktop configuration
site_url: https://renownitall.github.io/dotfiles/
repo_url: https://github.com/renownitall/dotfiles
repo_name: renownitall/dotfiles
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Keybindings: keybindings.md
  - Palette system: palette-system.md
  - Pickers: pickers.md
  - Screenshots, lock, and idle: screenshots-lock-idle.md
  - Background services: services.md
  - Status bar: statusbar.md
  - Themes: theming.md
