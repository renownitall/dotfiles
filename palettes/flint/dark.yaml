raw_aliases:
  - [accent_cyan, ansi_cyan]
  - [ansi_bright_green, success_bright]
  - [ansi_bright_red, error_bright]
  - [ansi_bright_white, text_max]
  - [ansi_bright_yellow, yellow_bright]
  - [ansi_green, success]
  - [ansi_red, error]
  - [ansi_yellow, yellow]
raw_near_aliases:
  - [ansi_black, surface_0]
  - [ansi_magenta, purple]

semantic_overrides:
  inc_search_bg: accent
  swaylock_caps_key_hl: yellow_bright
  swaylock_ring: overlay_dim
  window_focused_border: text
qt_bevel:
  - surface_2
  - surface_1
  - surface_0
  - bg
  - bg_subtle
