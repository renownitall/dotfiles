  gtk_theme: Orchis-Dark-Compact
  icon_theme: Papirus-Dark
  wallpaper: ~/Pictures/Wallpapers/dark/flower-basket.jpg
catppuccin_flavor: mocha
meta:
  description: A neutral grey dark theme with muted One Dark Pro-style ANSI hues.
  name: Flint
  variant: dark
