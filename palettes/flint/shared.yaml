contrast_checks:
  # Core text on backgrounds
  - [text, background, 4.5]
  - [text_max, background, 4.5]
  - [text_secondary, background, 4.5]
  - [text_muted, background, 4.5]
  - [text_secondary, surface_1, 4.5]
  - [text_muted, surface_0, 4.0]
  - [text_muted, surface_1, 4.0]
  - [text_max, surface_1, 4.5]
  - [text_max, surface_2, 4.5]
  # Selection & status surfaces
  - [on_selection, selection, 4.5]
  - [swaylock_key_hl, swaylock_ring, 2.0]
  - [swaylock_caps_key_hl, swaylock_ring, 1.8]
  - [swaylock_bs_hl, swaylock_ring, 1.2]
  - [on_critical, critical_bg, 4.5]
  - [on_warning, warning, 4.5]
  - [search_fg, search_bg, 3.0]
  - [on_accent, inc_search_bg, 3.0]
  - [emphasis_fg, emphasis_bg, 4.5]
  - [jump_label_fg, jump_label_bg, 4.5]
  # Borders
  - [border, background, 1.5]
  - [focus_border, background, 3.0]
  - [window_inactive_border, background, 1.5]
  # Accent & interactive
  - [emphasis_bg, background, 3.0]
  - [accent_text, background, 4.5]
  - [interactive_text, background, 4.5]
  - [url, background, 4.5]
  - [fastfetch_key, background, 4.5]
  - [purple_text, background, 4.5]
  - [error_text, background, 4.5]
  - [commit_hash, background, 4.5]
  # Qt surfaces
  - [text, qt_base, 4.5]
  - [text, qt_button, 4.5]
  - [text, qt_tooltip_base, 4.5]
  # Notices & warnings
  - [notice_fg, notice_bg, 4.5]
  - [warning_fg, warning_bg, 4.5]
  - [error_fg, error_bg, 4.5]
  - [notice_accent, notice_bg, 3.0]
  - [warning_accent, warning_bg, 3.0]
  - [error_text, error_bg, 3.0]
  # Network & status
  - [network_start, background, 3.0]
  - [network_mid, background, 3.0]
  - [network_end, background, 3.0]
  - [warning, background, 3.0]
  - [accent_strong, background, 3.0]
  - [rose, selection_subtle, 3.0]
  # Match & pick
  - [on_accent, diff_text, 4.5]
  - [accent_text, surface_1, 3.0]
  - [cherry_picked_fg, cherry_picked_bg, 4.5]
  # Subtle backgrounds
  - [text_secondary, background_subtle, 4.5]
  - [text_muted, background_subtle, 4.5]
  - [text_secondary, background_deep, 4.5]
  # Floor ceilings (documented honest limits)
  - [overlay_strong, background, 3.0]
  - [text_muted, surface_2, 3.0]
distinctness_checks:
  - [accent_text, accent_bright, 1.2, 10.0, "waybar focused:hover"]
  - [error_text, error_bright, 1.2, 10.0, "waybar urgent:hover"]
  - [fastfetch_key, fastfetch_logo, 1.2, 10.0, "fastfetch key vs logo"]
  - [
      focus_border,
      border_inactive,
      1.2,
      10.0,
      "sway/lazygit active vs inactive border",
    ]
  - [
      swaylock_caps_key_hl,
      swaylock_key_hl,
      1.2,
      10.0,
      "swaylock caps vs typing arc",
    ]
hue_budget:
  neutral_max_saturation: 10
  tolerance: 10
  near_white_lightness: 92
  near_black_lightness: 5
  exempt:
    - diff_add
    - diff_change
    - diff_delete
    - diff_text
    - warning_tint
  families:
    red: 355
    orange: 29
    yellow: 39
    green: 95
    mint: 143
    cyan: 187
    blue: 207
    purple: 286
