contrast_checks:
  # WCAG 2.2 AA implementation. Body text clears 4.5:1 (SC 1.4.3) and
  # boundaries and meaningful graphics clear 3:1 (SC 1.4.11). The
  # build aborts below any floor. Passing is not a conformance claim.
  # Body text on the background and on panels.
  - [text, background, 4.5]
  - [text_max, background, 4.5]
  - [text_secondary, background, 4.5]
  - [text_muted, background, 4.5]
  - [text_secondary, surface_1, 4.5]
  - [text_muted, surface_0, 4.5]
  - [text_muted, surface_1, 4.5]
  - [text_max, surface_1, 4.5]
  - [text_max, surface_2, 4.5]
  # Selected rows carry body text on surface_1 (fuzzel selection,
  # lazygit lines, sway titles, nvim popups, btop banner).
  - [text, surface_1, 4.5]
  # Highlight fills must read against the background so selected rows
  # scan as selected. House rule, not WCAG: 3:1 would force striped
  # panels, so 1.25:1 marks the floor here (light surface_1 is the
  # evidence-pinned official base-30 #E4E4E4, which caps this pair at
  # ~1.27:1). Text on top keeps its own 4.5:1 rows above.
  - [surface_1, background, 1.25]
  - [selection_subtle, background, 1.25]
  # btop meter troughs are fill-behind shading that must read against
  # the box background, or the unfilled portion of a meter vanishes.
  # Same house floor as the selection fills: shading, not a text
  # boundary, so 1.4:1 rather than 3:1.
  - [meter_bg, background, 1.4]
  # Selected and status text.
  - [on_selection, selection, 4.5]
  # Body text keeps its own color on the selection wash.
  - [text, selection_wash, 4.5]
  # Swaylock arcs are graphics: 3:1 against the ring and against the
  # background fill. The ring sits in a narrow band, 3:1 against both
  # the fill and the bright arcs, so move it only with the checker.
  - [swaylock_key_hl, swaylock_ring, 3.0]
  - [swaylock_caps_key_hl, swaylock_ring, 3.0]
  - [swaylock_bs_hl, swaylock_ring, 3.0]
  - [swaylock_key_hl, background, 3.0]
  - [swaylock_caps_key_hl, background, 3.0]
  - [swaylock_bs_hl, background, 3.0]
  - [swaylock_ring, background, 3.0]
  - [on_critical, critical_bg, 4.5]
  - [on_warning, warning, 4.5]
  # Search matches render body text.
  - [search_fg, search_bg, 4.5]
  - [on_blue, inc_search_bg, 4.5]
  - [emphasis_fg, emphasis_bg, 4.5]
  - [jump_label_fg, jump_label_bg, 4.5]
  # Boundaries clear 3:1 against the adjacent color only (SC 1.4.11,
  # not 2.4.13 focus appearance). Inactive borders are exempt. Focus
  # rings never sit on selection fills (verified in lazygit, waybar,
  # and fuzzel), so no focus-vs-selection pair exists. Add one if a
  # template starts doing that.
  - [focus_border, background, 3.0]
  # Popup frames sit on the float background (nvim FloatBorder).
  - [focus_border, background_subtle, 3.0]
  # Window frames clear 3:1 against the background and each other.
  - [window_focused_border, background, 3.0]
  - [window_focused_border, window_inactive_border, 3.0]
  # Waybar marks focused workspaces with accent text plus an accent
  # underline; the underline is the graphic here.
  # Accent fills as graphics (3:1); the text roles below stay at 4.5.
  - [emphasis_bg, background, 3.0]
  - [accent_text, background, 4.5]
  - [interactive_text, background, 4.5]
  - [url, background, 4.5]
  - [fastfetch_key, background, 4.5]
  - [purple_text, background, 4.5]
  - [error_text, background, 4.5]
  - [commit_hash, background, 4.5]
  # Status text on the background: lazygit options and authors plus
  # zellij exit codes (success), lazygit file types plus zellij cues
  # (cyan), lazygit marked commits plus waybar battery icons (caution),
  # and dunst progress text (notice_accent). Waybar urgent hovers pair
  # the bright error text with the error wash.
  - [success, background, 4.5]
  - [cyan, background, 4.5]
  - [caution, background, 4.5]
  - [notice_accent, background, 4.5]
  - [error_bright, error_bg, 4.5]
  # Qt and notification surfaces carry body text.
  - [text, qt_base, 4.5]
  - [text, qt_button, 4.5]
  - [text, qt_tooltip_base, 4.5]
  - [notice_fg, notice_bg, 4.5]
  - [warning_fg, warning_bg, 4.5]
  - [error_fg, error_bg, 4.5]
  - [notice_accent, notice_bg, 4.5]
  - [warning_accent, warning_bg, 4.5]
  # Waybar mode-pill text sits on the warning wash, not the background.
  - [warning_deep, warning_bg, 4.5]
  - [error_text, error_bg, 4.5]
  # Status strokes are graphics-only by contract, never body text.
  - [network_start, background, 3.0]
  - [network_mid, background, 3.0]
  - [network_end, background, 3.0]
  - [warning, background, 3.0]
  - [accent_strong, background, 3.0]
  - [rose, selection_subtle, 3.0]
  # Match and pick text (blue fills take the on_blue role, which the
  # dark theme flips to black).
  - [on_blue, diff_text, 4.5]
  - [accent_text, surface_1, 4.5]
  - [cherry_picked_fg, cherry_picked_bg, 4.5]
  # Diff washes keep syntax-colored code, so working green and blue
  # clear 4.5:1 on their washes directly.
  - [success, diff_add, 4.5]
  - [accent_text, diff_change, 4.5]
  # Captions on raised panels and the deepest surface.
  - [text_muted, surface_2, 4.5]
  - [cyan, surface_1, 4.5]
  - [overlay_dim, background, 4.5]
  - [text_secondary, background_subtle, 4.5]
  - [text_muted, background_subtle, 4.5]
  - [text_secondary, background_deep, 4.5]
  # Muted text on the deepest surface still renders body text. If a
  # future palette cannot carry it, rename the role instead of
  # lowering this floor.
  # Selection fills and the dark delete wash are text-backed by house
  # contract, not by exemption: every consumer remaps the text on top
  # (verified in foot, zellij, btop, zathura, nvim, and fuzzel), so
  # they carry no bare-fill floor. Deletion always pairs with a
  # non-color cue (gutter signs, +/- markers). State-vs-state pairs
  # have no WCAG floor; hue plus non-color cues separate them.
