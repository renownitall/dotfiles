alpha:
  # Zathura highlight fills composite over the page, so the checker
  # cannot express them. Text-over-composite was verified offline at
  # 4.5:1 or better in both variants and recolor modes. The 3:1
  # indicator floor is unattainable with a translucent fill in dark
  # recolor mode, so text readability wins there.
  border_40:
    - interactive_accent
    - 0.4
  error_90:
    - error
    - 0.9
  search_35:
    - search_bg
    - 0.35
  success_90:
    - success
    - 0.9
  text_8:
    - text_normal
    - 0.08
  transparent:
    - black
    - 0.0
  warning_90:
    - warning_deep
    - 0.9
