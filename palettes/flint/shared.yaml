semantic:
  inc_search_bg: diff_text
  meter_bg: track
  on_accent: text_max
  # Text on the accent-ish highlight fills. The official dark blue is
  # too light for white text, so the dark theme flips this to black;
  # light keeps on_accent.
  on_blue: on_accent
  text_accent: color_accent_1
  warning: yellow
apps:
  cherry_picked:
    fg: text_max
  emphasis:
    bg: color_accent_1
  fastfetch:
    key: color_accent_1
  jump_label:
    bg: color_accent_1
  notice:
    accent: color_accent_1
  qt:
    alternate_base: background_modifier_form_field
    base: background_primary
    # Shadow rides the base-30 border tone; light swaps in its base-30
    # surface. Obsidian draws no bevel outlines.
    shadow: secondary_alt
  search:
    bg: color_accent_1
  swaylock:
    bs_hl: error_bright
    caps_key_hl: yellow_bright
    key_hl: ansi_white
  window:
