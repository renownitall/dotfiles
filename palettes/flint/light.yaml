  ansi_white: "#E3E5E8"
  ansi_yellow: "#875C00"
  bg: "#F2F3F5"
  black: "#000000"
  border_inactive: "#B5BAC1"
  critical_bg: "#8F2F2F"
  bg_deep: "#C4C9CE"
