appearance:
  color_scheme: prefer-light
  gtk_theme: Orchis-Light-Compact
  icon_theme: Papirus-Light
  wallpaper: ~/Pictures/Wallpapers/light/roman-forum.jpg
catppuccin_flavor: latte
meta:
  description:
    Sand v3 draft. Sterile cool-gray neutrals with separated chromatics.
  name: Sand
  variant: light
raw:
  accent_blue: "#244A9A"
  accent_blue_bright: "#3A6A8A"
  accent_border: "#244A9A"
  accent_cyan: "#015F88"
