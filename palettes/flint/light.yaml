  diff_change: "#D9E2EA"
  diff_delete: "#EAD9D2"
  diff_text: "#33617F"
  error: "#B02518"
  error_bright: "#93454B"
  error_deep: "#7A2E2E"
  hover_blue: "#3A6A8A"
