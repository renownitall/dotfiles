raw_aliases:
  - [accent_blue_bright, hover_blue]
  - [accent_cyan, ansi_cyan]
  - [ansi_black, text]
  - [ansi_green, success]
  - [ansi_magenta, purple]
  - [ansi_red, error]
  - [ansi_yellow, yellow]
raw_near_aliases:
  - [ansi_blue, selection]
  - [ansi_bright_green, success_bright]

semantic_overrides:
  accent_text: accent_blue
  cherry_picked_fg: accent_border
  emphasis_bg: accent_border
  fastfetch_key: accent_blue
  inc_search_bg: accent_blue
  interactive_text: accent_blue
  jump_label_bg: accent_border
  notice_accent: accent_blue
  on_accent: bg
  on_critical: bg
  on_selection: bg
  purple_text: purple
  qt_shadow: overlay_strong
  search_bg: accent_blue
  search_fg: bg
  selection_subtle: surface_0
  swaylock_bs_hl: error
  swaylock_key_hl: text
  swaylock_ring: background_subtle
  terminal_selection_fg: bg
  url: accent_blue
  window_focused_border: text
qt_bevel:
  - bg
  - surface_0
  - surface_1
  - bg_deep
  - surface_2
