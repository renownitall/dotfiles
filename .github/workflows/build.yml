name: Check Dotfiles and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# `shell: bash` gives every `run:` step `-o pipefail`. The default
# `bash -e {0}` drops it, so a mid-pipeline failure goes unnoticed.
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      # Same pinned images as forge. Every checker the gates call (sway, i3,
      # foot, fuzzel, rofi, systemd-analyze) comes from [extra], so one
      # pacman pass provisions the verification list from AGENTS.md.
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
      options: --user root
    permissions:
      contents: read
    steps:
      - name: Cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-checks-${{ github.run_id }}
          restore-keys: |
            pacman-checks-

      # actions/checkout only records a .git directory when git already
      # exists in the container, and the palette gate diffs regenerated
      # files against it. Git comes from pacman, so this upgrade runs
      # before checkout puts retry.sh on disk, which is why the loop
      # repeats that script's logic for these two calls.
      - name: Setup pacman and install git for checkout
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          retry() {
            attempt=1
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 3 ]; then
                echo "::error::Command failed after three attempts: $*"
                exit 1
              fi
              echo "::warning::Command failed (attempt $((attempt - 1))/3), retrying in 10s: $*"
              sleep 10
            done
          }
          retry pacman -Syu --noconfirm --noprogressbar
          retry pacman -S --noconfirm --needed --noprogressbar git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-checks-${{ hashFiles('Makefile') }}
          restore-keys: |
            uv-checks-

      - name: Setup check environment
        # awww, redshift, and wlsunset are the external binaries the applied
        # units point at, and systemd-analyze fails on missing executables.
        run: |
          .github/scripts/retry.sh pacman -S --noconfirm --needed --noprogressbar \
            awww chezmoi foot fuzzel i3-wm neovim nodejs npm python redshift \
            rofi sway systemd uv wlsunset

      - name: Check docs formatting
        run: make lint

      - name: Check the MPRIS modules
        run: make check-mpris

      - name: Check the sw wallpaper utility
        run: make check-sw

      - name: Check the generated palette
        run: |
          make palette
          # The LUT palettes are committed. A palette.py or color-scheme.md
          # change without a regeneration fails here instead of at apply.
          git diff --exit-code -- home/dot_config/lutgen

      - name: Apply the configuration
        # The run_onchange scripts install from the forge repository, which
        # a CI container does not have configured, so apply validates
        # everything except the scripts.
        run: chezmoi apply --source "$GITHUB_WORKSPACE" --no-tty --force --exclude scripts

      - name: Validate the applied configs
        run: make check-config

      - name: Probe the deployed colorscheme
        # The first run bootstraps lazy.nvim from the network, then probe
        # checks the deployed colorscheme against the generated palette.
        # The timeout bounds a stalled clone.
        run: timeout 900 nvim --headless -c "luafile meta/probe.lua"

      - name: Check the pinned refs URLs
        run: make check-refs

  docs:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
      options: --user root
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup docs environment
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          .github/scripts/retry.sh pacman -Syu --noconfirm --noprogressbar
          .github/scripts/retry.sh pacman -S --noconfirm --needed --noprogressbar make python uv

      - name: Build the site
        run: make site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: [checks, docs]
    # Gate publishing on main because workflow_dispatch can start from any ref.
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
