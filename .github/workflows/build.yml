name: Check Dotfiles and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# `shell: bash` gives every `run:` step `-o pipefail`. The default
# `bash -e {0}` drops it, so a mid-pipeline failure goes unnoticed.
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
      options: --user root
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup docs environment
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          .github/scripts/retry.sh pacman -Syu --noconfirm --noprogressbar
          .github/scripts/retry.sh pacman -S --noconfirm --needed --noprogressbar make python uv

      - name: Build the site
        run: make site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: [docs]
    # Gate publishing on main because workflow_dispatch can start from any ref.
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
