font=GoogleSansCode Nerd Font Mono:size=8
icon-theme=Papirus-Dark
width=56
anchor=center
minimal-lines=yes
horizontal-pad=16
inner-pad=8
prompt=" "
placeholder="find something..."

# Locked scheme (Waybar neutral-*); opaque.
[colors]
background=#202020FF
text=#D4D4D4FF
message=#8A8A8AFF
prompt=#8A8A8AFF
placeholder=#8A8A8AFF
input=#D4D4D4FF
match=#98C3FFFF
selection=#3A3F4BFF
selection-text=#FFFFFFFF
selection-match=#98C3FFFF
counter=#8A8A8AFF
border=#5A5A5AFF

# Square to match the bar (fuzzel defaults to radius 10).
[border]
width=1
radius=0

[main]
namespace = launcher
