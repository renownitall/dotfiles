font=GeistMono Nerd Font Mono:size=8
icon-theme=Papirus-Dark
width=56
anchor=center
minimal-lines=yes
horizontal-pad=16
inner-pad=8
prompt=" "
placeholder="find something..."

# Temporary neutral dark palette, same as the Waybar tmp-* set. Opaque.
[colors]
background=#202020FF
text=#D4D4D4FF
message=#8A8A8AFF
prompt=#8A8A8AFF
placeholder=#8A8A8AFF
input=#D4D4D4FF
match=#9AB8FFFF
selection=#2D2D2DFF
selection-text=#FFFFFFFF
selection-match=#9AB8FFFF
counter=#8A8A8AFF
border=#3A3A3AFF

# Square chrome to match the bar: fuzzel defaults to radius 10.
[border]
width=1
radius=0

[main]
namespace = launcher
