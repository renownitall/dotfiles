# Locked scheme (meta/color-scheme.md); font, padding and opacity mirror foot.

# BEGIN_KITTY_FONTS
font_family      family="SauceCodePro Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 10.0

# Mirrors foot: pad=4x4 and alpha=0.9 over the picom blur.
window_padding_width 4
background_opacity 0.9

# No trailing cursor over the shell block.
shell_integration no-cursor

include current-theme.conf
